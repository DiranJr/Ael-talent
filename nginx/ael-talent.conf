# ==============================================================================
# A&L Talent — Configuração Hardened do Nginx Reverse Proxy (Debian 13 / Ubuntu 24.04)
# Substitua <DOMAIN> pelo domínio oficial (ex: carreiras.aelengenharia.com.br)
# ==============================================================================

# ─── 1. HTTP — REDIRECIONAMENTO PARA HTTPS & CERTBOT CHALLENGE ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name <DOMAIN>;

    # Desafio Let's Encrypt / Certbot para renovação automática
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirecionamento permanente para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── 2. HTTPS — SERVIDOR PRINCIPAL SEGURO (TLS 1.2 / TLS 1.3) ─────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <DOMAIN>;

    # Certificados SSL gerenciados pelo Certbot (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

    # Otimização e Parâmetros Criptográficos SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Cabeçalhos de Segurança HTTP (Hardening de Produção)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-ancestors 'self';" always;

    # HSTS (Descomente após validar o certificado SSL em produção)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Limite máximo de upload para currículos (PDF/DOCX)
    client_max_body_size 10M;

    # Compactação Gzip para alta performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ─── 3. FRONTEND SPA (Build Estático Otimizado) ───────────────────────────
    root /var/www/ael-talent/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache imutável para assets estáticos com hash
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # ─── 4. REST API (Proxy Reverso para o Container Express na Porta 3001) ────
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
