# ==============================================================================
# A&L Talent — Configuração do Nginx para Debian 13
# Domínio: carreiras.aelengenharia.com.br (ou aelengenharia.com.br)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name carreiras.aelengenharia.com.br;

    # Redirecionamento automático para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carreiras.aelengenharia.com.br;

    # Certificados SSL gerenciados pelo Certbot (Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/carreiras.aelengenharia.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/carreiras.aelengenharia.com.br/privkey.pem;

    # Otimização e Segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Cabeçalhos de Segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limite máximo de upload para currículos (PDF/DOCX)
    client_max_body_size 10M;

    # Compactação Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 1. FRONTEND SPA (Build estático gerado pelo Vite)
    root /var/www/ael-talent/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos (CSS, JS, Imagens, Fontes)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # 2. BACKEND REST API (Proxy para o container Node.js / Express na porta 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }
}
