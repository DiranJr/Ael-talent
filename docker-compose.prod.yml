# ==============================================================================
# A&L Talent + OpenCATS — Docker Compose de Produção (Debian 13 / Ubuntu 24.04)
# ==============================================================================
services:

  # ─── 1. API BACKEND (Node.js 20 / Express) ──────────────────────────────────
  api:
    image: node:20-alpine
    container_name: ael_api_prod
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - uploads_data:/app/opencats/upload
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-cats}
      - DB_USER=${DB_USER:-ael_prod}
      - DB_PASS=${DB_PASS}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://carreiras.aelengenharia.com.br}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    ports:
      - "127.0.0.1:3001:3001" # Exposição estritamente local (loopback) para o Nginx Host
    command: sh -c "npm install --omit=dev && node server/index.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ael_prod_net

  # ─── 2. BANCO DE DADOS (MariaDB 10.11 LTS) ──────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: ael_db_prod
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
      - MYSQL_DATABASE=${DB_NAME:-cats}
      - MYSQL_USER=${DB_USER:-ael_prod}
      - MYSQL_PASSWORD=${DB_PASS}
      - TZ=${TZ:-America/Sao_Paulo}
    volumes:
      - db_data:/var/lib/mysql
    # Nenhuma porta publicada para o host (Acesso isolado na rede ael_prod_net)
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - ael_prod_net

  # ─── 3. OPENCATS ENGINE (Motor PHP Interno / Legado) ────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    container_name: ael_web_prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80" # Restrito estritamente a loopback / túnel SSH administrativo
    volumes:
      - ./opencats:/var/www/html
      - uploads_data:/var/www/html/upload
      - attachments_data:/var/www/html/attachments
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-cats}
      - DB_USER=${DB_USER:-ael_prod}
      - DB_PASS=${DB_PASS}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ael_prod_net

volumes:
  db_data:
    name: ael_mariadb_data
    driver: local
  uploads_data:
    name: ael_uploads_data
    driver: local
  attachments_data:
    name: ael_attachments_data
    driver: local

networks:
  ael_prod_net:
    name: ael_production_network
    driver: bridge
